version: "3.8"
services:
  app:
    build: ..
    image: rive-backup-gen:latest
    environment:
      NODE_ENV: production
      PORT: "3001"
      CORS_ORIGIN: "https://bbg.mrwolf.be"
      AUTH_MODE: production
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET:?AUTH_SESSION_SECRET is required}
      RATE_LIMIT_MAX: "30"
      CAPTURE_CONCURRENCY: "2"
      WORKLOAD_CONCURRENCY: "2"
      TENANT_WORKLOAD_CONCURRENCY: "1"
      WORKLOAD_QUEUE_MAX: "100"
      LOG_LEVEL: info
      LOG_FORMAT: json
    volumes:
      - ../../temp:/app/temp
    networks:
      - appnet

  nginx:
    image: nginx:stable
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - appnet

networks:
  appnet:
    driver: bridge
